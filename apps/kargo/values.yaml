api:
  adminAccount:
    enabled: true
  secret:
    name: kargo-admin
  tls:
    # chart default (true) provisions a cert-manager self-signed cert for
    # this API server specifically - unneeded either way, TLS terminates
    # upstream instead (ALB's wildcard cert on aws, plain port-forward on
    # local). Separate from the internal webhooks server's own cert-manager
    # requirement (see docs/addons/kargo.md), which chart defaults still
    # handle regardless of this setting
    enabled: false
  oidc:
    enabled: true
    # admins/viewers must be direct children of oidc, not nested under dex -
    # oidc.dex has no admins/viewers key of its own, so nesting them there
    # silently no-ops: the authenticated user gets zero RBAC even though
    # login itself succeeds (see docs/adr/0006).
    admins:
      claims:
        email:
          - atkaridarshan04@gmail.com
    dex:
      enabled: true
      connectors:
        - id: github
          name: GitHub
          type: github
          config:
            clientID: "$GITHUB_CLIENT_ID"
            clientSecret: "$GITHUB_CLIENT_SECRET"
            redirectURI: "http://localhost:8082/dex/callback"
      env:
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kargo-admin
              key: dex.github.clientID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kargo-admin
              key: dex.github.clientSecret
  # api.host is the single source of truth the chart uses to compute the
  # Dex issuer URL (api.oidc.issuerURL is ignored whenever Dex is enabled) -
  # without it, Dex falls back to a portless default ("localhost", not
  # "localhost:8082"), which doesn't match the port-forwarded address above
  # or redirectURI below, breaking the GitHub OAuth callback even though
  # nothing else looks wrong.
  host: localhost:8082
