api:
  adminAccount:
    enabled: true
  secret:
    name: kargo-admin
  tls:
    # chart default (true) provisions a cert-manager self-signed cert for
    # this API server specifically - unneeded either way, TLS terminates
    # upstream instead (ALB's wildcard cert on aws, plain port-forward on
    # local). Separate from the internal webhooks server's own cert-manager
    # requirement (see docs/addons/kargo.md), which chart defaults still
    # handle regardless of this setting
    enabled: false
  # api.host is the single source of truth the chart uses to compute the
  # Dex issuer URL (api.oidc.issuerURL is ignored whenever Dex is enabled) -
  # without it, Dex defaults to a portless issuer ("http://localhost/dex"
  # instead of "http://localhost:8082/dex"), which doesn't match the
  # port-forwarded address or redirectURI below, breaking the GitHub OAuth
  # callback with no server-side error logged.
  host: localhost:8082
  oidc:
    enabled: true
    dex:
      enabled: true
      connectors:
        - id: github
          name: GitHub
          type: github
          config:
            clientID: Ov23li762pyy20AtPuXQ
            clientSecret: "$GITHUB_CLIENT_SECRET"
            redirectURI: "http://localhost:8082/dex/callback"
            # orgs restriction removed: atkaridarshan04 is a personal GitHub
            # account, not an Organization, so Dex's org-membership check
            # always rejects it - throwaway unblock for personal-account
            # testing, matching the same workaround already applied to
            # Grafana's config below. Revert once the real personal-account
            # vs. org toggle ships from platform-generator.
      admins:
        claims:
          email:
            - atkaridarshan04@gmail.com
      env:
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kargo-admin
              key: dex.github.clientSecret
