# Watches kargo_image_repo_url for new tags matching kargo_image_constraint
# and produces Freight when something new shows up.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # see project.yaml - CRD not registered yet at sync-validation time
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subscriptions:
    - image:
        repoURL: hashicorp/http-echo
        constraint: ">=1.0.0"
