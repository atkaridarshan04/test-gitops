# sync-wave "1" - after the kargo Application (wave "0") has actually
# installed the controller and its CRDs, not just been applied
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # ArgoCD validates the whole sync batch upfront, including this Kargo
    # CRD instance, before wave "0" installs the Kargo chart that actually
    # registers the CRD - without this, first sync fails "the server could
    # not find the requested resource" and retries forever
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
