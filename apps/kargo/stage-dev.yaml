# dev takes new Freight directly from the Warehouse - no upstream Stage required.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # see project.yaml - CRD not registered yet at sync-validation time
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        direct: true

  promotionTemplate:
    spec:
      vars:
        - name: overlayPath
          value: ./overlays/dev
        - name: appName
          value: app-dev
        - name: branch
          value: main
      steps:
        - task:
            name: promote-overlay
          as: promote
