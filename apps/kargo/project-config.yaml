# dev/staging auto-promote; prod requires a human to merge the PR Kargo
# opens (git-wait-for-pr in promotion-task.yaml blocks until someone does).
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: app
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # see project.yaml - CRD not registered yet at sync-validation time
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: staging
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: false
