# Mesh-wide default is already PERMISSIVE with no PeerAuthentication at all
# (Istio's own default) - this makes that explicit and documented, and is
# the scope for this first pass; STRICT is a deliberate follow-up once
# every addon in this repo is confirmed sidecar-injected (see root README's
# "Not yet in this repo").
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # security.istio.io/v1 isn't registered until istio-base (wave "-1")
    # actually installs - see CLAUDE.md's ArgoCD conventions for why this
    # is needed regardless of sync-wave
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  mtls:
    mode: PERMISSIVE
