grafana:
  admin:
    existingSecret: grafana-admin-credentials
  persistence:
    enabled: true
    storageClassName: standard
    size: 5Gi
  grafana.ini:
    server:
      # GitHub's OAuth callback is "<root_url>/login/github" - must match
      # the actual public URL or the callback silently 404s
      root_url: "http://localhost:3000"
    auth.github:
      enabled: true
      allow_sign_up: true
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      # No allowed_organizations (personal mode, no org restriction) -
      # every GitHub login except the named identity below gets Grafana's
      # default auto_assign_org_role (Viewer), matching Admin only for
      # grafana_github_sso_personal_username.
      role_attribute_path: login=='atkaridarshan04' && 'Admin' || 'Viewer'
  # client_id/client_secret are deliberately absent from grafana.ini above -
  # GF_AUTH_GITHUB_CLIENT_ID/CLIENT_SECRET below override that section's
  # keys without ever landing in the rendered ConfigMap
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_ID:
      secretKeyRef:
        name: grafana-admin-credentials
        key: github-client-id
    GF_AUTH_GITHUB_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-admin-credentials
        key: github-client-secret
prometheus:
  prometheusSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
# PROTOTYPE (not yet part of platform-generator's templates): exposes
# Kargo's Promotion/Stage/Warehouse/Freight CR state as Prometheus metrics
# via kube-state-metrics' Custom Resource State feature - independent of
# whether Kargo's own controller emits kargo_* metrics.
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: ["kargo.akuity.io"]
        resources: ["promotions", "stages", "warehouses", "freight"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: kargo.akuity.io
              version: v1alpha1
              kind: Promotion
            labelsFromPath:
              namespace: [metadata, namespace]
              promotion: [metadata, name]
              stage: [spec, stage]
            metricNamePrefix: kargo_promotion
            metrics:
              - name: phase
                help: "Kargo Promotion phase"
                each:
                  type: StateSet
                  stateSet:
                    path: [status, phase]
                    labelName: phase
                    list: [Pending, Running, Succeeded, Failed, Errored, Aborted]

          - groupVersionKind:
              group: kargo.akuity.io
              version: v1alpha1
              kind: Stage
            labelsFromPath:
              namespace: [metadata, namespace]
              stage: [metadata, name]
            metricNamePrefix: kargo_stage
            metrics:
              - name: condition
                help: "Kargo Stage condition status (Ready/Healthy/Verified), 1=True 0=False or Unknown"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: ["type"]
                      reason: ["reason"]
                    valueFrom: ["status"]

          - groupVersionKind:
              group: kargo.akuity.io
              version: v1alpha1
              kind: Warehouse
            labelsFromPath:
              namespace: [metadata, namespace]
              warehouse: [metadata, name]
            metricNamePrefix: kargo_warehouse
            metrics:
              - name: condition
                help: "Kargo Warehouse condition status, 1=True 0=False or Unknown"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: ["type"]
                      reason: ["reason"]
                    valueFrom: ["status"]

          - groupVersionKind:
              group: kargo.akuity.io
              version: v1alpha1
              kind: Freight
            labelsFromPath:
              namespace: [metadata, namespace]
              freight: [metadata, name]
            metricNamePrefix: kargo_freight
            metrics:
              - name: currently_in_stage
                help: "Timestamp a Freight entered a Stage's currently-in set (still present there)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, currentlyIn]
                    labelFromKey: stage
                    valueFrom: [since]
              - name: verified_in_stage
                help: "Timestamp a Freight was verified in a Stage"
                each:
                  type: Gauge
                  gauge:
                    path: [status, verifiedIn]
                    labelFromKey: stage
                    valueFrom: [verifiedAt]
