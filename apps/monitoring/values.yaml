grafana:
  admin:
    existingSecret: grafana-admin-credentials
  persistence:
    enabled: true
    storageClassName: standard
    size: 5Gi
  grafana.ini:
    # TEST ONLY - verifying whether Grafana 13's disabling of the legacy
    # numeric-ID datasource proxy API is why the vendored Istio dashboards'
    # query_result()-based $namespace/$service/$workload variables come up
    # empty. Not meant to land in the generator as-is.
    feature_toggles:
      datasourceLegacyIdApi: true
    server:
      # GitHub's OAuth callback is "<root_url>/login/github" - must match
      # the actual public URL or the callback silently 404s
      root_url: "http://localhost:3000"
    auth.github:
      enabled: true
      allow_sign_up: true
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      # No allowed_organizations (personal mode, no org restriction) -
      # every GitHub login except the named identity below gets Grafana's
      # default auto_assign_org_role (Viewer), matching Admin only for
      # grafana_github_sso_personal_username.
      role_attribute_path: login=='atkaridarshan04' && 'Admin' || 'Viewer'
  # client_id/client_secret are deliberately absent from grafana.ini above -
  # GF_AUTH_GITHUB_CLIENT_ID/CLIENT_SECRET below override that section's
  # keys without ever landing in the rendered ConfigMap
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_ID:
      secretKeyRef:
        name: grafana-admin-credentials
        key: github-client-id
    GF_AUTH_GITHUB_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-admin-credentials
        key: github-client-secret
prometheus:
  prometheusSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
