apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    # platform tier, after istio-base's CRDs (wave "-1")
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: "1.29.7"
    helm:
      # kind has no metrics-server, so the HPA this chart creates by default
      # can never scale and sits permanently Degraded - aws gets a real
      # metrics-server via the EKS module and keeps the chart default.
      values: |
        pilot:
          autoscaleEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    # istiod's own webhook controller patches in the real caBundle and
    # flips failurePolicy to Fail once it's ready - the chart ships neither
    # set, so this is permanent, expected drift, not a config bug.
    - kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks
