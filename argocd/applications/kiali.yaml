apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    # after istiod (wave "0") - Kiali reads the mesh's own config/telemetry.
    # Wave "2" (platform-tier, must follow another platform addon), not "1"
    # (onboarded apps) - see CLAUDE.md's ArgoCD conventions.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: "2.9.0"
      helm:
        valueFiles:
          - $values/apps/kiali/values.yaml
    - repoURL: https://github.com/atkaridarshan04/test-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
