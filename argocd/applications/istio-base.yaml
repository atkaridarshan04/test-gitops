apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    # cluster-addon tier - CRDs before istiod (platform tier, wave "0")
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: "1.29.7"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # destinationrules.networking.istio.io alone is ~325KB raw - exceeds
      # the 262144-byte last-applied-configuration limit under client-side apply
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    # istiod's own webhook controller patches in the real caBundle and
    # flips failurePolicy to Fail once it's ready - the chart ships neither
    # set, so this is permanent, expected drift, not a config bug.
    - kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks
