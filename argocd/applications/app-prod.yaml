apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-prod
  namespace: argocd
  annotations:
    # after cluster-addons (-1) and monitoring (0) - the app shouldn't sync before the platform's ready
    argocd.argoproj.io/sync-wave: "1"
    # Kargo never creates this Application, only updates it once it exists
    # (Kargo's own docs) - must match the Project/Stage name Kargo generates
    kargo.akuity.io/authorized-stage: app:prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/atkaridarshan04/test-app.git
    path: ./kustomize/overlays/prod
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
